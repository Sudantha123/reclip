services:
  reclip:
    build: .
    image: reclip:latest
    container_name: reclip
    ports:
      - "8899:8899"
    volumes:
      - reclip-downloads:/app/downloads
    restart: unless-stopped

  reclip-telegram:
    build: .
    image: reclip:latest
    container_name: reclip-telegram
    command: ["python", "/app/telegram_bot.py"]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in your environment}
      DOWNLOAD_DIR: /app/downloads
      TELEGRAM_MAX_FILE_MB: ${TELEGRAM_MAX_FILE_MB:-1950}
      BOT_MAX_CONCURRENT: ${BOT_MAX_CONCURRENT:-2}
    volumes:
      - reclip-downloads:/app/downloads
    restart: unless-stopped
    depends_on:
      - reclip

volumes:
  reclip-downloads:
